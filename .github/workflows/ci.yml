name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce task scope
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run python tools/check_scope.py
      - name: Skip scope on main push
        if: github.event_name != 'pull_request'
        run: |
          echo "SKIP scope: task scope is enforced on pull requests only"

  tasks-lint:
    name: tasks-lint
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate task metadata
        run: uv run python tools/tasks.py lint

  test-count:
    name: test-count
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent test-count regression
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run python tools/count_tests.py
      - name: Skip test count on main push
        if: github.event_name != 'pull_request'
        run: |
          echo "SKIP test-count: regression comparison is enforced on pull requests only"

  format:
    name: format
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: make fmt-check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint

  godot-test:
    name: godot-import + test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Import and run GUT tests
        run: make test
      - name: Godot import log
        if: always()
        shell: bash
        run: |
          echo "::group::Godot import log (/tmp/wow-godot-import.log)"
          if [[ -f /tmp/wow-godot-import.log ]]; then
            cat /tmp/wow-godot-import.log
          else
            echo "Godot import log was not created."
          fi
          echo "::endgroup::"

  pipeline-test:
    name: pipeline pytest
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect pipeline changes
        id: pipeline_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git -C "$GITHUB_WORKSPACE" rev-list --max-parents=0 HEAD)"
            fi
          fi

          changed_paths="$(git -C "$GITHUB_WORKSPACE" diff --name-only "$base" "$GITHUB_SHA" -- pipeline/)"

          if [[ -n "$changed_paths" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pipeline/ changed; running pipeline tests."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP pipeline-test: no changes under pipeline/"
          fi
      - name: Run pipeline tests
        if: steps.pipeline_changes.outputs.changed == 'true'
        run: make pipeline-test

  tools-test:
    name: tools pytest
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tools tests
        run: make tools-test

  ui-guards:
    name: UI literals + generated theme
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check UI tokens and translated copy
        run: make ui-check
      - name: Verify clean-cache generated theme outputs
        run: make theme-check

  remote-config-validation:
    name: remote-config-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate remote config before publishing
        run: python3 tools/validate_remote_config.py

  registries:
    name: registries
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registries and literal service calls
        run: make registries

  content-validate:
    name: content-validate
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate shipped content
        run: make content-validate

  android-build:
    name: Android prototype debug APK
    needs: [format, lint, registries, content-validate, godot-test, ui-guards]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify debug APK without upload secrets
        run: >-
          uv run python tools/android_debug_build.py
          --templates /root/.local/share/godot/export_templates/4.7.2.stable
      - name: Report Android debug package size (download proxy)
        run: >-
          uv run python tools/check_app_size.py builds/world-of-words-debug.apk
          --measurement debug-apk --report builds/android-debug-size.json
      - uses: actions/upload-artifact@v4
        with:
          name: world-of-words-android-debug
          path: |
            builds/world-of-words-debug.apk
            builds/android-debug-verification.txt
            builds/android-debug-size.json
          if-no-files-found: error
          retention-days: 14

  release-inspection:
    name: Android release resource inspection
    needs: [format, lint, godot-test, ui-guards]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      XDG_DATA_HOME: /root/.local/share
      XDG_CONFIG_HOME: /root/.config
    steps:
      - uses: actions/checkout@v4
      - name: Export and inspect actual unsigned Android Release resources
        run: >-
          uv run python tools/check_release_export.py builds/android-release-content.zip
          --export --report builds/android-release-inspection.json
      - uses: actions/upload-artifact@v4
        with:
          name: world-of-words-release-content
          path: |
            builds/android-release-content.zip
            builds/android-release-inspection.json
          if-no-files-found: error
          retention-days: 14

  economy-sim:
    name: Economy simulation report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect economy simulation changes
        id: economy_changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${BEFORE_SHA:-}}"
          python3 tools/econ_sim_ci.py --base "$base" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Skip unchanged economy inputs
        if: steps.economy_changes.outputs.changed != 'true'
        run: |
          echo "SKIP economy-sim: no relevant config or simulator changes"
      - name: Generate readable economy reports
        if: steps.economy_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/economy
          python3 tools/econ_sim.py --json builds/economy/default.json --markdown builds/economy/default.md
          python3 tools/econ_sim.py --no-onboarding --bonus-per-level 0 --json builds/economy/base-only.json --markdown builds/economy/base-only.md
          echo "Base-only saver has only completion income; other policies still assume their requested ads." >> "$GITHUB_STEP_SUMMARY"
          for report in builds/economy/default.md builds/economy/base-only.md; do
            cat "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: steps.economy_changes.outputs.changed == 'true'
        with:
          name: economy-simulation
          path: builds/economy/
          if-no-files-found: error
          retention-days: 14

  gallery-screenshots:
    name: Gallery screenshots
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect gallery changes including deletions
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run python tools/gallery_screenshots.py --filter-only --base "$BASE_REF" --github-output "$GITHUB_OUTPUT"
      - name: Install native software-rendering runtime
        if: steps.changes.outputs.render == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Render and verify the complete catalog matrix
        if: steps.changes.outputs.render == 'true'
        run: uv run python tools/gallery_screenshots.py --output builds/gallery
      - name: Skip unchanged gallery
        if: steps.changes.outputs.render != 'true'
        run: echo "SKIP gallery screenshots - no relevant UI changes"
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.render == 'true'
        with:
          name: gallery-screenshots
          path: builds/gallery/
          if-no-files-found: error
          retention-days: 7
