name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  TOOLCHAIN_IMAGE: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain:latest

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.TOOLCHAIN_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: make fmt-check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.TOOLCHAIN_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint

  godot-test:
    name: godot-import + test
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.TOOLCHAIN_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Import and run GUT tests
        run: make test
      - name: Godot import log
        if: always()
        shell: bash
        run: |
          echo "::group::Godot import log (/tmp/wow-godot-import.log)"
          if [[ -f /tmp/wow-godot-import.log ]]; then
            cat /tmp/wow-godot-import.log
          else
            echo "Godot import log was not created."
          fi
          echo "::endgroup::"

  pipeline-test:
    name: pipeline pytest
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.TOOLCHAIN_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect pipeline changes
        id: pipeline_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          if git diff --name-only "$base" "$GITHUB_SHA" -- pipeline/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pipeline/ changed; running pipeline tests."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP pipeline-test: no changes under pipeline/"
          fi
      - name: Run pipeline tests
        if: steps.pipeline_changes.outputs.changed == 'true'
        run: make pipeline-test

  tools-test:
    name: tools pytest
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.TOOLCHAIN_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tools tests
        run: make tools-test
