name: toolchain-image

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/toolchain-image.yml"]
  pull_request:
    paths: ["docker/**", ".github/workflows/toolchain-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/krystiangaleczka-tech/world-of-words-toolchain

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (Godot import of game/, tools present)
        run: |
          docker run --rm -v "$PWD:/workspace" ${{ env.IMAGE }}:test bash -euo pipefail -c '
            godot --headless --version
            godot --headless --path game --import --quit 2>&1 | tee /tmp/import.log
            ! grep -E "^(ERROR|SCRIPT ERROR)" /tmp/import.log
            sdkmanager --list_installed | grep -E "platforms;android-36"
            java -version; uv --version; gdformat --version; make --version | head -1'
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE }}:test ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:test ${{ env.IMAGE }}:sha-${GITHUB_SHA::7}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:sha-${GITHUB_SHA::7}
