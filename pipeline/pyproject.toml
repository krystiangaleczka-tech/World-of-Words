[project]
name = "wow-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
annotate = ["morfeusz2==1.99.15"]

[project.scripts]
wg = "wordgame_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_pipeline", "src/wordgame_pipeline"]
