[project]
name = "world-of-words-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["wow-pipeline", "wow-tools"]

[tool.uv.sources]
wow-pipeline = { workspace = true }
wow-tools = { workspace = true }

[tool.uv]
dev-dependencies = [
  "ruff==0.16.10",
  "pytest==9.1.1",
  "hypothesis==6.168.3",
  "gdtoolkit==4.5.0",
]

[tool.uv.workspace]
members = ["pipeline", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "tools/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = ["wow_pipeline", "wow_tools"]
